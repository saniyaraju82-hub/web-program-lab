<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>


<body>

    <div class="container">
        <h1>Weather Information</h1>

        <input type="text" id="city"
               placeholder="Enter city name">

        <br>

        <button onclick="getWeather()">Get Weather</button>

        <div id="result"></div>
    </div>

    <script>
        async function getWeather() {
            let city = document.getElementById("city").value.trim();
            let result = document.getElementById("result");

            if (city === "") {
                result.innerHTML = "Please enter a city name";
                return;
            }

            result.innerHTML = "Loading...";

            try {
                let geoUrl =
                    "https://geocoding-api.open-meteo.com/v1/search?name="
                    + encodeURIComponent(city) + "&count=1&language=en&format=json";

                let geoResponse = await fetch(geoUrl);

                if (!geoResponse.ok) {
                    throw new Error("Unable to find city");
                }

                let geoData = await geoResponse.json();

                if (!geoData.results || geoData.results.length === 0) {
                    result.innerHTML = "City not found!";
                    return;
                }

                let place = geoData.results[0];

                let weatherUrl =
                    "https://api.open-meteo.com/v1/forecast?latitude="
                    + place.latitude
                    + "&longitude=" + place.longitude
                    + "&current=temperature_2m,relative_humidity_2m,weather_code";

                let weatherResponse = await fetch(weatherUrl);

                if (!weatherResponse.ok) {
                    throw new Error("Weather data unavailable");
                }

                let weatherData = await weatherResponse.json();
                let current = weatherData.current;

                result.innerHTML = `
                    <h3>${place.name}</h3>
                    <p>Temperature: ${current.temperature_2m} °C</p>
                    <p>Humidity: ${current.relative_humidity_2m}%</p>
                    <p>Weather: ${getDescription(current.weather_code)}</p>
                `;

            } catch (error) {
                result.innerHTML =
                    "Unable to fetch weather. Check your internet connection.";
            }
        }

        function getDescription(code) {
            if (code === 0) return "Clear Sky";
            if ([1, 2, 3].includes(code)) return "Partly Cloudy";
            if ([45, 48].includes(code)) return "Foggy";
            if ([51, 53, 55, 56, 57].includes(code)) return "Drizzle";
            if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code))
                return "Rainy";
            if ([71, 73, 75, 77, 85, 86].includes(code))
                return "Snowy";
            if ([95, 96, 99].includes(code)) return "Thunderstorm";
            return "Unknown Weather";
        }
    </script>

</body>
</html>
