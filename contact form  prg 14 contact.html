<!DOCTYPE html>
<html>
<head>
    <title>Contact Form</title>
</head>
<body>

    <h2>Contact Form</h2>

    <form method="POST" action="/">
        <label>Name:</label>
        <input type="text" name="name" required>
        <br><br>

        <label>Email:</label>
        <input type="email" name="email" required>
        <br><br>

        <label>Message:</label>
        <textarea name="message" required></textarea>
        <br><br>

        <button type="submit">Submit</button>
    </form>

    <h3>{{ msg }}</h3>

</body>
</html>
