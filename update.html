<!DOCTYPE html>
<html>
<head>
    <title>Update Employee</title>
</head>
<body>

<h2>Update Employee Details</h2>

<form method="POST">
    <input type="text" name="name" value="{{ data[1] }}" required>
    <input type="text" name="dept" value="{{ data[2] }}" required>
    <input type="number" name="salary" value="{{ data[3] }}" required>

    <button type="submit">Update Employee</button>
</form>

<a href="/">Back</a>

</body>
</html>
